onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

